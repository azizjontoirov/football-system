name: Football System CI/CD

on:
  push:
    branches: [ "main", "develop" ]
  pull_request:
    branches: [ "main", "develop" ]

jobs:
  lint-and-test:
    name: Kod uslubi (Ruff) va Testlar (Pytest)
    runs-on: ubuntu-latest

    steps:
      - name: Repozitoriyni yuklab olish
        uses: actions/checkout@v4

      - name: Python 3.12 muhitini sozlash
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Kutubxonalarni o'rnatish
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Ruff linter tekshiruvi
        run: ruff check app tests

      - name: Pytest va kod qamrovi (Coverage)
        run: pytest -v --cov=app --cov-report=term-missing

  docker-build:
    name: Docker tasvirini yig'ish (Build)
    runs-on: ubuntu-latest
    needs: lint-and-test

    steps:
      - name: Repozitoriyni yuklab olish
        uses: actions/checkout@v4

      - name: Docker tasvirini tekshirish
        run: docker build -t football-system:ci .
        